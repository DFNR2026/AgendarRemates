<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenda de remates</title>
<script>/* Tema guardado en este PC. Sin dato, oscuro. */function TEMA(){return document.documentElement.dataset.tema||'oscuro'}function PONER_TEMA(t){if(t==='claro')document.documentElement.dataset.tema='claro';else delete document.documentElement.dataset.tema}try{PONER_TEMA(localStorage.getItem('tema'))}catch(e){}
/* Tamaño de la letra elegido por Diego (22 de Octubre). Agranda toda la página, de 80% a 200% en pasos de 10%. Sin dato, 100%. */
let LETRA=1;function PONER_LETRA(z){LETRA=Math.min(2,Math.max(0.8,Math.round((+z||1)*10)/10));document.documentElement.style.zoom=LETRA===1?'':String(LETRA);}try{PONER_LETRA(localStorage.getItem('letra'))}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Diseño de la variante B elegida por Diego el 18 de Octubre (crema y café), con modo oscuro desde el 21 de Octubre. Si no hay internet, usa las letras del PC. */
/* Modo oscuro predeterminado, tema Grafito y cian (Diego, 22 de Octubre, antes café oscuro desde el 21). El claro es el original de la variante B y se elige con el botón Modo claro. Letra y esquinas van en variables (--letra, --mono, --r) para que el claro no cambie. */
:root{--fondo:#111315;--papel:#191C20;--blanco:#20242A;--borde:#2E333B;--tinta:#E7E9EC;--suave:#9AA3AE;--cafe:#5CC8DB;--vv:#1F4650;--rojo:#F07A6A;--negro:#050607;--hoy:#F7F8FA;--sobre:#071A1E;--sel:#16303A;--lk-tx:#8FDCEA;--lk-borde:#2E6672;--lk-ant:#4A505A;--mano:#2C3440;--mano-tx:#C9D4E2;--asu:#262B31;--err:#24191C;--err-tx:#F6B3AA;--amb:#1F2328;--amb-tx:#F2CF7E;--info:#23272D;--tinta2:#BCC3CC;--linea:#262A31;--campo:#3A4049;--verde:#1B2A27;--verde-tx:#9FDDB3;--ok:#86D19E;--amb2:#1F2328;--amb2-tx:#F2CF7E;--famb-tx:#F2CF7E;--famb-borde:#A8863A;--cita:#D5D9DE;--finde:#6F7781;--sombra:rgba(0,0,0,.6);--velo:rgba(0,0,0,.78);--fn-borde:#3A4049;--fn-nota:#B8C0CA;--letra:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;--mono:'IBM Plex Mono',Consolas,monospace;--r:.45;--verde-borde:#3F7A5A;color-scheme:dark}
:root[data-tema="claro"]{--fondo:#F3EBDD;--papel:#FBF6EC;--blanco:#FFFFFF;--borde:#DCCBB0;--tinta:#3B2A1E;--suave:#7A6450;--cafe:#6B3F22;--vv:#D9B98C;--rojo:#A3301F;--negro:#1A1410;--hoy:#1A1410;--sobre:#FFFFFF;--sel:#F2E2C6;--lk-tx:#4A2A15;--lk-borde:#C8A878;--lk-ant:#B79A74;--mano:#E8D5B5;--mano-tx:#4A2A10;--asu:#E9C98F;--err:#F6DDD7;--err-tx:#7E2214;--amb:#F2E0BC;--amb-tx:#5A3A0E;--info:#EFE5D3;--tinta2:#5C4A39;--linea:#E8DCC8;--campo:#C8B08C;--verde:#E3EDD9;--verde-tx:#2F5424;--ok:#3E6B2F;--amb2:#F6E3B4;--amb2-tx:#6A4300;--famb-tx:#4A3000;--famb-borde:#DDBB6C;--cita:#4A3A2C;--finde:#9C8670;--sombra:rgba(59,42,30,.18);--velo:rgba(26,20,16,.82);--fn-borde:transparent;--fn-nota:#E8D5B5;--letra:'Archivo','Segoe UI',system-ui,sans-serif;--mono:'JetBrains Mono',Consolas,monospace;--r:1;--verde-borde:transparent;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--tinta);font-family:var(--letra)}
a{color:var(--cafe)}a:hover{color:var(--lk-tx)}
button{font-family:inherit}
.raiz{position:relative;min-height:100vh;display:flex;flex-wrap:wrap}
.izq{flex:0 0 340px;max-width:100%;background:var(--papel);border-right:1px solid var(--borde);padding:26px 20px;display:flex;flex-direction:column;gap:12px}
.centro{flex:999 1 560px;min-width:0;padding:26px 28px 48px;display:flex;flex-direction:column;gap:16px}
.riel{width:84px;padding-top:22px;display:flex;justify-content:center}
.lupa{width:60px;height:60px;border-radius:calc(18px*var(--r));border:0;background:var(--cafe);color:var(--sobre);cursor:pointer;display:flex;align-items:center;justify-content:center}
.panel{position:absolute;top:0;right:0;min-height:100%;width:440px;max-width:100%;background:var(--papel);border-left:1px solid var(--borde);box-shadow:-12px 0 32px var(--sombra);padding:26px 22px;display:flex;flex-direction:column;gap:12px}
.oculto{display:none}
h2.tit{margin:0;font-size:17px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.cuenta{background:var(--cafe);color:var(--sobre);border-radius:999px;padding:2px 9px;font-size:13px;font-weight:700}
.tarjeta{background:var(--blanco);border:1px solid var(--borde);border-radius:calc(12px*var(--r));padding:12px 14px;display:flex;flex-direction:column;gap:5px;scroll-margin-top:16px}
.tarjeta.sel{background:var(--sel);border:2px solid var(--cafe)}
.fila{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.rol{font-family:var(--mono);font-size:13px;font-weight:600}
.car{font-weight:600;font-size:14px;line-height:1.3}
.peq{font-size:13px}.gris{color:var(--suave)}
.x{width:32px;height:32px;border:1px solid var(--borde);background:var(--papel);color:var(--suave);border-radius:calc(8px*var(--r));cursor:pointer;flex:0 0 auto}
.x44{width:44px;height:44px;border:1px solid var(--borde);background:var(--fondo);color:var(--tinta);border-radius:calc(10px*var(--r));cursor:pointer;font-size:18px}
.etq{align-self:flex-start;font-size:11px;font-weight:800;padding:2px 7px;border-radius:calc(4px*var(--r));letter-spacing:.04em}
.etq.mano{background:var(--mano);color:var(--mano-tx)}.etq.llamado{background:var(--cafe);color:var(--sobre)}
.tag{font-size:11px;font-weight:800;padding:2px 6px;border-radius:calc(4px*var(--r))}
.tag.asu{background:var(--asu);color:var(--mano-tx)}.tag.pct{background:var(--rojo);color:var(--sobre)}
.al{font-size:12px;padding:6px 8px;border-radius:calc(8px*var(--r))}
.al.rojo{background:var(--err);color:var(--err-tx);font-weight:700}.al.ambar{background:var(--amb);color:var(--amb-tx)}.al.info{background:var(--info);color:var(--tinta2)}
.links{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lk{display:inline-flex;align-items:center;min-height:30px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;text-decoration:none;background:var(--sel);color:var(--lk-tx);border:1px solid var(--lk-borde)}
.lk.ant{background:var(--papel);color:var(--suave);border:1px dashed var(--lk-ant)}
.btn{background:var(--cafe);color:var(--sobre);border:0;border-radius:calc(10px*var(--r));padding:10px 16px;min-height:44px;font-size:14px;font-weight:700;cursor:pointer}
.btn2:disabled{opacity:.4;cursor:default}
.limpiable{position:relative;display:block}.limpiable .campo{padding-right:40px}
.borrar{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:32px;height:32px;border:0;border-radius:999px;background:var(--borde);color:var(--tinta);cursor:pointer;font-size:14px;line-height:1}.borrar[hidden]{display:none}.borrar:hover{background:var(--suave);color:var(--papel)}
.btn2{background:var(--papel);color:var(--cafe);border:1px solid var(--cafe);border-radius:calc(8px*var(--r));padding:6px 12px;min-height:36px;font-size:13px;font-weight:700;cursor:pointer}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;cursor:pointer}.chk input{width:18px;height:18px;accent-color:var(--cafe)}
.aviso-pub{background:var(--mano);border-radius:calc(8px*var(--r));padding:8px 10px;font-size:12px;display:flex;flex-direction:column;gap:6px}
header.cab{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.velo{position:fixed;inset:0;background:var(--velo);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}.velo[hidden]{display:none}.velo .caja{background:var(--papel);color:var(--tinta);border-radius:calc(18px*var(--r));padding:28px 30px;max-width:560px;width:100%;display:flex;flex-direction:column;gap:14px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.ley{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--suave)}
.ley span{display:flex;gap:6px;align-items:center}
.franja{border-radius:calc(14px*var(--r));padding:18px 22px;display:flex;flex-direction:column;gap:10px}
.franja.negra{background:var(--negro);color:#FFFFFF;box-shadow:inset 0 0 0 1px var(--fn-borde)}.franja.ambar{background:var(--amb2);color:var(--famb-tx);border:1px solid var(--famb-borde);padding:14px 20px;gap:4px}
.franja.rojo{background:var(--rojo);color:var(--sobre)}.franja.llam{background:var(--mano);border:1px solid var(--lk-borde)}
.detalle{background:var(--papel);color:var(--tinta);border-radius:calc(10px*var(--r));padding:16px 18px;display:flex;flex-direction:column;gap:16px}
table.cmp{border-collapse:collapse;width:100%;font-size:14px}
table.cmp th,table.cmp td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--linea)}
table.cmp thead th{border-bottom:2px solid var(--borde);color:var(--suave);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.mes{background:var(--papel);border:1px solid var(--borde);border-radius:calc(14px*var(--r));display:flex;flex-direction:column;gap:6px}
.grilla{display:grid;border-bottom:1px solid var(--linea)}
.carril{font-size:12px;padding:0 8px 0 0;display:flex;flex-direction:column;justify-content:center;min-width:0;text-align:left;background:none;border:0;cursor:pointer;color:var(--tinta)}
.carril b,.carril span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ico{display:flex;align-items:center;justify-content:center;border-radius:calc(7px*var(--r));cursor:pointer;padding:0;background:var(--papel);color:var(--cafe);border:2px solid var(--cafe)}
.nav{display:flex;gap:8px;align-items:center}
input.campo,select.campo{height:40px;border:1px solid var(--campo);border-radius:calc(10px*var(--r));padding:0 10px;font-family:inherit;font-size:14px;background:var(--blanco);color:var(--tinta);min-width:0;width:100%}
label.lab{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--suave)}
.caja{background:var(--blanco);border:1px solid var(--borde);border-radius:calc(12px*var(--r));padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.caja h3{margin:0;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--suave)}
.chip{font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px}
.chip.verde{background:var(--verde);color:var(--verde-tx)}.chip.ambar{background:var(--amb2);color:var(--amb2-tx)}.chip.rojo{background:var(--err);color:var(--err-tx)}
.ufbox{background:var(--fondo);border-radius:calc(10px*var(--r));padding:10px 12px;display:flex;flex-direction:column;gap:6px}
blockquote{margin:0;padding:8px 12px;background:var(--fondo);border-radius:calc(8px*var(--r));font-size:13px;line-height:1.45;color:var(--cita);font-style:italic}
#toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--rojo);color:var(--sobre);padding:12px 18px;border-radius:calc(10px*var(--r));font-weight:700;z-index:9;max-width:90vw}
/* Ficha bajo el calendario (Diego, 22 de Octubre). Antes era el panel derecho. */
.ficha{background:var(--papel);border:2px solid var(--cafe);border-radius:calc(18px*var(--r));padding:24px 28px;display:flex;flex-direction:column;gap:20px;scroll-margin-top:16px}
.ficha .tres{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.ficha .dos{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.ficha .caja{padding:18px 20px;gap:10px}.ficha .caja h3{font-size:13px}.ficha blockquote{font-size:15px}
.caja.dinero{align-items:center;justify-content:center;text-align:center}
.tipos{display:flex;gap:8px}
.tipo{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;border-radius:calc(10px*var(--r));border:1px dashed var(--borde);color:var(--suave);font-size:12px;font-weight:700;text-align:center}
.tipo.on{border:2px solid var(--cafe);background:var(--cafe);color:var(--sobre);font-weight:800}
.alertas{display:flex;flex-direction:column;gap:10px;background:var(--amb);border:2px solid var(--famb-borde);border-radius:calc(14px*var(--r));padding:16px 18px;color:var(--amb-tx)}
.alertas.grave{background:var(--err);border-color:var(--rojo);color:var(--err-tx)}
.alertas .cab-al{display:flex;align-items:center;gap:10px}
.alertas h3{margin:0;font-size:16px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:inherit}
.alertas .n{background:var(--amb-tx);color:var(--amb);border-radius:999px;padding:2px 10px;font-size:13px;font-weight:800}.alertas.grave .n{background:var(--err-tx);color:var(--err)}
.alerta{display:flex;gap:10px;align-items:flex-start;background:var(--papel);border-radius:calc(10px*var(--r));padding:12px 14px}
.alerta .bang{flex:0 0 auto;width:24px;height:24px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;background:var(--amb-tx);color:var(--amb)}
.alerta.rojo .bang{background:var(--rojo);color:var(--sobre)}.alerta.info .bang{background:var(--suave);color:var(--papel)}
.alerta .tx{font-size:17px;font-weight:700;line-height:1.35;color:var(--tinta)}
@media (max-width:600px){.ficha{padding:16px}.ficha h2{font-size:24px !important}.alerta .tx{font-size:15px}}

/* Solo en el tema Grafito (oscuro). Las alertas llevan el color en el borde y la letra, nunca de relleno. */
:root:not([data-tema="claro"]) h2{letter-spacing:-.01em}:root:not([data-tema="claro"]) .btn,:root:not([data-tema="claro"]) .btn2{text-transform:uppercase;letter-spacing:.06em;font-size:12px}:root:not([data-tema="claro"]) .franja.rojo{background:var(--err);color:var(--tinta);border:2px solid var(--rojo)}:root:not([data-tema="claro"]) .franja.ambar,:root:not([data-tema="claro"]) .al.ambar,:root:not([data-tema="claro"]) .chip.ambar{border:1px solid var(--famb-borde)}:root:not([data-tema="claro"]) .al.rojo,:root:not([data-tema="claro"]) .chip.rojo{border:1px solid var(--rojo)}:root:not([data-tema="claro"]) .chip.verde{border:1px solid var(--verde-borde)}:root:not([data-tema="claro"]) .tag.asu{color:var(--amb-tx);border:1px solid var(--famb-borde)}
</style>
</head>
<body>
<div class="raiz">
  <aside class="izq" id="izq" aria-label="Causas agendadas"></aside>
  <main class="centro" id="centro"><p>Cargando la agenda...</p></main>
  <div class="riel"><button class="lupa" data-acc="buscar" aria-label="Buscar y añadir remates"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4.2-4.2"></path></svg></button></div>
  <aside class="panel oculto" id="panel"></aside>
</div>
<div id="toast" class="oculto" role="alert"></div>
<div id="velo" class="velo" hidden></div>
<script>
// Agenda de remates (18 de Octubre). Lee todo de /api/estado y manda las acciones de Diego al servidor local.
const MES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const INI=['D','L','M','M','J','V','S'];
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SVG={
 pres:s=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2.5l8.5 8.5-3.2 3.2-8.5-8.5z"/><path d="M14.1 9.9L4.5 19.5"/><path d="M3 21.5h9"/></svg>`,
 virt:s=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="3.5" width="19" height="12.5" rx="1.5"/><path d="M12 16v3.5"/><path d="M7.5 20.5h9"/></svg>`,
 nose:s=>`<span style="font-size:${s-3}px;font-weight:800;line-height:1" aria-hidden="true">?</span>`};
let EST=null;
const FORM0=()=>({trib:'',rol:'',anio:'',car:'',fecha:'',hora:'',mod:'pres',vd:'',vh:'',monto:''});
const UI={panel:null,ficha:null,verFicha:false,sel:null,off:0,detC:false,detL:false,uf:'',f:{trib:'',rol:'',anio:'',dir:'',edicion:'',pasados:false},res:null,form:FORM0(),err:'',ftrib:''};
const clave=it=>it.tipo==='manual'?'m'+it.manual_id:'b'+it.bien_id;
const item=k=>(EST&&EST.agenda||[]).find(x=>clave(x)===k);

async function api(ruta,cuerpo){
  const r=await fetch(ruta,cuerpo?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(cuerpo)}:{cache:'no-store'});
  const j=await r.json(); if(j.ok===false) throw new Error(j.error||'Error'); return j;}
function aviso(t){const d=document.getElementById('toast');d.textContent=t;d.classList.remove('oculto');clearTimeout(aviso.t);aviso.t=setTimeout(()=>d.classList.add('oculto'),7000);}
async function cargar(){try{EST=await api('/api/estado');render();}catch(e){aviso('No se pudo leer la agenda. '+e.message);}}
async function hacer(ruta,cuerpo){try{const r=await api(ruta,cuerpo);await cargar();if(UI.panel==='buscar')await buscar();return r;}catch(e){aviso(e.message);return null;}}

function fmtCLP(n){return '$'+Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.');}
function leerUF(t){if(!t)return null;const n=Number(String(t).replace(/[$\s]/g,'').replace(/\./g,'').replace(',','.'));return isFinite(n)&&n>0?n:null;}
function ufCalc(uf,txt){const n=leerUF(UI.uf);return n?`${txt} × ${fmtCLP(n)} = ${fmtCLP(uf*n)}`:'Pega el valor de la UF para ver el monto en pesos';}
function diaCorto(d){const t=new Date(d+'T12:00');return ['Dom.','Lun.','Mar.','Mié.','Jue.','Vie.','Sáb.'][t.getDay()]+' '+t.getDate()+' '+['Ene.','Feb.','Mar.','Abr.','May.','Jun.','Jul.','Ago.','Sep.','Oct.','Nov.','Dic.'][t.getMonth()];}

function etiquetas(it){let h='';if(it.asumido)h+=' <span class="tag asu">ASUMIDO</span>';if(it.otro_porcentaje)h+=` <span class="tag pct">${E(it.otro_porcentaje)}</span>`;return h;}
function linksHTML(pubs,titulo){if(!pubs||!pubs.length)return '';
  return `<div class="links"><span class="gris" style="font-size:12px">${E(titulo)}</span>${pubs.map(p=>p.href?`<a class="lk${p.ant?' ant':''}" href="${E(p.href)}" target="_blank" rel="noopener">${p.ant?'Llamado anterior, ':''}${E(p.texto)}</a>`+(p.href_fin?`<a class="lk${p.ant?' ant':''}" href="${E(p.href_fin)}" target="_blank" rel="noopener">${E(p.texto)} (sigue)</a>`:''):'').join('')}</div>`;}
function ufHTML(it){return it.uf?`<div class="ufbox"><label class="lab" style="color:var(--tinta);font-weight:700">Cálculo de VV por UF<input class="campo" data-uf-in value="${E(UI.uf)}" placeholder="Pega aquí el valor de la UF"></label><div class="rol" data-uf="${it.uf}" data-uftxt="${E(it.uf_txt)}">${E(ufCalc(it.uf,it.uf_txt))}</div></div>`:'';}

// --- Columna izquierda ---------------------------------------------------------------------------------------------
function renderIzq(){
  const tribs=[...new Set(EST.agenda.map(it=>it.tribunal||'Sin tribunal'))].sort((a,b)=>a.localeCompare(b,'es',{numeric:true}));
  if(UI.ftrib&&!tribs.includes(UI.ftrib))UI.ftrib='';   // el tribunal elegido ya no tiene causas agendadas
  const ag=UI.ftrib?EST.agenda.filter(it=>(it.tribunal||'Sin tribunal')===UI.ftrib):EST.agenda;
  let h=`<div class="fila"><h2 class="tit">Causas agendadas</h2><span class="cuenta">${UI.ftrib?ag.length+' de '+EST.agenda.length:ag.length}</span></div>`;

// --- Calendario ----------------------------------------------------------------------------------------------------
const ALTO={chico:30,grande:44,medio:38};
function iso(y,m,d){return y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');}
function itemsCal(){return EST.agenda.map(it=>({k:clave(it),tc:it.tc,rol:it.rol+(it.inmueble?' · '+it.inmueble:''),remate:it.fecha_remate,hora:it.hora,mod:it.mod,
  vd:(it.vv_desde||it.vv_hasta||'').slice(0,10)||null,vh:(it.vv_hasta||'').slice(0,10)||null,ent:it.vv_entregado,rojo:it.cambio_fecha,manual:it.tipo==='manual'}));}
function mes(y,m,tam,ags){
  const dim=new Date(y,m+1,0).getDate(),g=tam==='grande',H=EST.hoy;const isos=[];for(let d=1;d<=dim;d++)isos.push(iso(y,m,d));
  const lanes=ags.filter(a=>isos.includes(a.remate)||(a.vd&&!a.ent&&a.vd<=isos[dim-1]&&a.vh>=isos[0]));
  const negro='var(--hoy)',sh='inset 3px 0 0 '+negro+',inset -3px 0 0 '+negro;
  const cols=`grid-template-columns:${g?'190px':'170px'} repeat(${dim},minmax(0,1fr))`;
  const nR=ags.filter(a=>isos.includes(a.remate)).length;
  let h=`<section class="mes" style="padding:${g?'20px 20px 16px':'14px 18px'}"><div class="fila"><h2 style="margin:0;font-weight:800;font-size:${g?'30px':'18px'};color:${g?'var(--tinta)':'var(--suave)'}">${MES[m]} ${y}</h2><span class="gris" style="font-size:12px">${nR?(nR===1?'1 remate':nR+' remates'):''}</span></div>`;
  h+=`<div class="grilla" style="${cols}"><div class="gris" style="font-size:11px;align-self:end;padding:4px 0">Causa</div>`;
  for(const d of isos){const dw=new Date(d+'T12:00').getDay(),fer=EST.feriados[d],hoy=d===H,fin=dw===0||dw===6;
    h+=`<div title="${E(fer||'')}" style="display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10px;padding:4px 0;min-width:0;color:${fer?'var(--rojo)':(fin?'var(--finde)':'var(--suave)')};${hoy?'box-shadow:'+sh+',inset 0 3px 0 '+negro+(lanes.length?';border-radius:calc(6px*var(--r)) calc(6px*var(--r)) 0 0':',inset 0 -3px 0 '+negro+';border-radius:calc(6px*var(--r))'):''}"><span>${INI[dw]}</span><span style="font-size:${g?13:11}px;font-weight:700;color:${fer?'var(--rojo)':'var(--tinta)'}">${+d.slice(8)}</span></div>`;}
  h+='</div>';
  lanes.forEach((a,ia)=>{
    const sub=a.remate?(isos.includes(a.remate)?'Remate '+diaCorto(a.remate)+(a.hora?' '+a.hora:''):'Remate el '+diaCorto(a.remate)):'Sin fecha del remate';
    h+=`<div class="grilla" style="${cols}"><button class="carril" data-acc="ficha" data-k="${a.k}"><b>${E(a.tc)} · <span class="rol" style="font-size:12px">${E(a.rol)}</span></b><span class="gris" style="font-size:11px">${a.manual?'A mano · ':''}${E(sub)}</span></button>`;
    for(const d of isos){const enVV=a.vd&&!a.ent&&a.vd<=d&&d<=a.vh,esR=a.remate===d,hoy=d===H;const ini=enVV&&(d===a.vd||d===isos[0]),fin=enVV&&(d===a.vh||d===isos[dim-1]);
      let st=`height:${ALTO[tam]}px;min-width:0;display:flex;align-items:center;justify-content:center;`;
      if(enVV)st+='background:var(--vv);'+(ini?'border-top-left-radius:calc(6px*var(--r));border-bottom-left-radius:calc(6px*var(--r));':'')+(fin?'border-top-right-radius:calc(6px*var(--r));border-bottom-right-radius:calc(6px*var(--r));':'');
      if(hoy)st+='box-shadow:'+sh+(ia===lanes.length-1?',inset 0 -3px 0 '+negro+';border-bottom-left-radius:calc(6px*var(--r));border-bottom-right-radius:calc(6px*var(--r));':';');
      let c='';if(esR){const s=g?28:24,mar=UI.sel===a.k;
        c=`<button class="ico" data-acc="ficha" data-k="${a.k}" aria-label="Remate ${E(a.rol)} ${E(a.hora||'')}" style="width:${s}px;height:${s}px;${mar?'background:var(--cafe);color:var(--sobre);':''}${a.rojo?'border-color:var(--rojo);'+(mar?'':'color:var(--rojo);'):''}${a.manual?'border-style:dashed;':''}">${SVG[a.mod](17)}</button>`;}
      h+=`<div style="${st}">${c}</div>`;}
    h+='</div>';});
  if(!lanes.length)h+=`<div class="peq gris" style="padding:8px 0">Sin remates agendados este mes</div>`;
  return h+'</section>';}

function tablaCmp(c,tachar){return `<div style="display:flex;flex-direction:column;gap:8px"><div style="font-size:15px;font-weight:800">${E(c.titulo)}</div><div class="peq gris">${E(c.caratula)}</div><div style="overflow-x:auto"><table class="cmp"><thead><tr><th scope="col">Dato</th><th scope="col">${E(c.antes)}</th><th scope="col">${E(c.despues)}</th></tr></thead><tbody>${c.filas.map(f=>`<tr><th scope="row">${E(f.campo)}</th><td style="color:var(--suave);${tachar?'text-decoration:line-through':''}">${E(f.a)}</td><td style="font-weight:700;${tachar?'color:var(--rojo)':''}">${E(f.b)}</td></tr>`).join('')}${(c.pub_a||c.pub_b)?`<tr><th scope="row">Avisos del Mercurio</th><td>${c.pub_a?linksHTML([c.pub_a],''):''}</td><td>${c.pub_b?linksHTML([c.pub_b],''):''}</td></tr>`:''}</tbody></table></div>${c.nota?`<div class="gris" style="font-size:12px">${E(c.nota)}</div>`:''}</div>`;}

    <span style="color:var(--cafe)">${SVG.pres(16)}<span class="gris">Presencial</span></span><span style="color:var(--cafe)">${SVG.virt(16)}<span class="gris">Virtual</span></span>
    <span><span style="width:16px;height:16px;border:2px solid var(--cafe);color:var(--cafe);border-radius:999px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800">?</span>Sin modalidad</span>

  if(EST.franja_negra.length){const [t,...r]=EST.franja_negra;h+=`<section class="franja negra" role="alert"><div style="font-size:22px;font-weight:800">SIN SINCRONIZAR</div>${[t.replace('SIN SINCRONIZAR. ',''),...r].map(x=>`<div style="font-size:14px">${E(x)}</div>`).join('')}<div style="font-size:13px;color:var(--fn-nota)">El calendario puede no estar al día. Aprieta Actualizar ahora. Si siguen faltando, la nube todavía no ha leído esas ediciones. Este aviso no se puede cerrar mientras falten.</div></section>`;}
  if(EST.franja_ambar.length)h+=`<section class="franja ambar" role="status"><div style="font-size:15px;font-weight:800">EDICIONES CARGADAS PERO INCOMPLETAS</div>${EST.franja_ambar.map(x=>`<div style="font-size:13px">${E(x)}</div>`).join('')}</section>`;
  if(EST.cambios.length)h+=`<section class="franja rojo" role="alert"><div class="fila"><div style="flex:1 1 400px;font-size:22px;font-weight:800">${E(EST.titulo_cambios)}</div><button class="btn" style="background:var(--papel);color:var(--rojo)" data-acc="detC">${UI.detC?'Ocultar detalles':'Revisar detalles'}</button></div>${UI.detC?`<div class="detalle">${EST.cambios.map(c=>tablaCmp(c,true)).join('')}<button class="btn" style="align-self:flex-start" data-acc="vistoC">Marcar como visto</button></div>`:''}</section>`;
  if(EST.llamados.length)h+=`<section class="franja llam" role="status"><div class="fila"><div style="flex:1 1 400px"><div style="font-size:19px;font-weight:800">NUEVO LLAMADO EN UNA CAUSA AGENDADA</div><div class="peq" style="color:var(--tinta2)">Un remate que no se hizo vuelve a publicarse. Es un remate nuevo, con sus propias bases.</div></div><button class="btn" data-acc="detL">${UI.detL?'Ocultar detalles':'Revisar detalles'}</button></div>${UI.detL?`<div class="detalle">${EST.llamados.map(c=>tablaCmp(c,false)).join('')}<button class="btn" style="align-self:flex-start" data-acc="vistoL">Marcar como visto</button></div>`:''}</section>`;
  h+=`<div class="nav">${UI.off>0?'<button class="btn2" data-acc="mesAnt">◀ Mes anterior</button>':''}<button class="btn2" data-acc="mesHoy">Volver a hoy</button><button class="btn2" data-acc="mesSig">Mes siguiente ▶</button></div>`;
  const hoy=new Date(EST.hoy+'T12:00'),ags=itemsCal();
  [0,1].forEach((d,i)=>{const t=new Date(hoy.getFullYear(),hoy.getMonth()+UI.off+d,1);h+=mes(t.getFullYear(),t.getMonth(),i===0?'grande':'medio',ags);});   // mes actual y siguiente (Diego, 18 de Octubre)
  if(UI.verFicha){const it=item(UI.ficha);if(it)h+=fichaHTML(it);else UI.verFicha=false;}   // ficha bajo el calendario (Diego, 22 de Octubre)
  document.getElementById('centro').innerHTML=h;}

function icoVV(t){const cal='<rect x="3" y="4.5" width="18" height="16" rx="2"></rect><path d="M3 9.5h18"></path><path d="M8 2.5v4"></path><path d="M16 2.5v4"></path>';
  const d=t==='remate'?'<path d="M13 2.5l8.5 8.5-3.2 3.2-8.5-8.5z"></path><path d="M14.1 9.9L4.5 19.5"></path><path d="M3 21.5h9"></path>':cal+ICO_VV[t];

const NOM_VV={rango:'Rango de días',dia:'Un día fijo',remate:'En el remate'},TIT_VV={rango:'Rango de días',dia:'Un día fijo',remate:'En el mismo remate'};

    :'<section style="display:flex;flex-direction:column;gap:8px"><h3 style="margin:0;font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--suave)">Alertas del aviso</h3><div class="peq" style="color:var(--ok);font-weight:700">Sin alertas.</div></section>';

  const p=document.getElementById('panel');if(!UI.panel){p.classList.add('oculto');p.innerHTML='';return;}p.classList.remove('oculto');let h='';
  if(UI.panel==='buscar'){const f=UI.f;
    h=`<div class="fila"><h2 class="tit">Buscar remates</h2><button class="x44" data-acc="cerrar" aria-label="Cerrar buscador">✕</button></div>
    <label class="lab">Corte<input class="campo" value="CA de Santiago" disabled style="background:var(--fondo);color:var(--suave)"></label>
    <div style="display:grid;grid-template-columns:1.6fr 1fr .8fr;gap:8px">${campoF('trib','Tribunal')}${campoF('rol','Rol')}${campoF('anio','Año')}</div>
    ${campoF('dir','Dirección o comuna')}
    <label class="lab">Edición<select class="campo" data-filtro="edicion"><option value="">Todas las ediciones</option>${EST.ediciones.map(e=>`<option value="${e}" ${f.edicion===e?'selected':''}>${E(EST.ediciones_txt[e])}</option>`).join('')}</select></label>
    <label class="chk"><input type="checkbox" data-filtro="pasados" ${f.pasados?'checked':''}>Incluir remates que ya pasaron</label>
    <button class="btn2" style="border-style:dashed;min-height:44px" data-acc="manual">+ Agregar una causa a mano</button><div id="res" style="display:flex;flex-direction:column;gap:12px"></div>`;}
  else if(UI.panel==='manual'){const F=UI.form;const c=(n,t,lab,ph)=>`<label class="lab">${lab}<input class="campo" type="${t}" data-form="${n}" value="${E(F[n])}" ${ph?`placeholder="${E(ph)}"`:''}></label>`;
    h=`<div class="fila"><h2 class="tit">Causa a mano</h2><button class="x44" data-acc="buscar" aria-label="Volver al buscador">←</button></div>
    <div class="peq" style="color:var(--tinta2)">Para una causa que no salió en El Mercurio o que el programa no leyó. En el calendario queda marcada como agregada a mano.</div>
    ${c('trib','text','Tribunal','Ej. 15° Juzgado Civil de Santiago')}<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">${c('rol','text','Rol')}${c('anio','text','Año')}</div>${c('car','text','Carátula (opcional)')}
    <div style="display:grid;grid-template-columns:1.4fr 1fr;gap:8px">${c('fecha','date','Fecha del remate')}${c('hora','time','Hora')}</div>
    <label class="lab">Modalidad<select class="campo" data-form="mod">${[['pres','Presencial'],['virt','Virtual (Zoom o en línea)'],['nose','No lo sé']].map(([v,t])=>`<option value="${v}" ${F.mod===v?'selected':''}>${t}</option>`).join('')}</select></label>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">${c('vd','date','Vale vista desde')}${c('vh','date','Vale vista hasta')}</div>${c('monto','text','Monto del vale vista (opcional)','Ej. $7.500.000 o 98,5 UF')}
    ${UI.err?`<div class="al rojo" style="font-size:13px">${E(UI.err)}</div>`:''}<button class="btn" style="align-self:flex-start" data-acc="guardarManual">Agregar al calendario</button>`;}
  p.innerHTML=h;if(UI.panel==='buscar')renderRes();}
function render(){renderIzq();renderCentro();renderPanel();}

// --- Acciones ------------------------------------------------------------------------------------------------------
document.addEventListener('click',async e=>{const b=e.target.closest('[data-acc]');if(!b||b.type==='checkbox')return;const a=b.dataset.acc,k=b.dataset.k;
  if(a==='letraMas'||a==='letraMenos'||a==='letraBase'){PONER_LETRA(a==='letraBase'?1:LETRA+(a==='letraMas'?0.1:-0.1));try{localStorage.setItem('letra',LETRA)}catch(e){}renderCentro();}
  else if(a==='tema'){const t=TEMA()==='claro'?'oscuro':'claro';PONER_TEMA(t);try{localStorage.setItem('tema',t)}catch(e){}renderCentro();}
  else if(a==='nubeAct'||a==='nubeReintentar'){await actualizarNube();}
  else if(a==='nubeSeguir'||a==='nubeOk'){NUBE.estado='oculto';renderVelo();}
  else if(a==='buscar'){UI.panel='buscar';renderPanel();if(!UI.res)await buscar();}
  else if(a==='cerrar'){UI.panel=null;renderPanel();}
  else if(a==='limpiar'){const n=b.dataset.campo,i=document.querySelector(`input[data-filtro="${n}"]`);UI.f[n]='';if(i){i.value='';i.focus();}b.hidden=true;clearTimeout(espera);await buscar();}
  else if(a==='manual'){UI.panel='manual';UI.err='';renderPanel();}
  else if(a==='ficha'){UI.ficha=k;UI.sel=k;UI.verFicha=true;render();irAFicha();}
  else if(a==='cerrarFicha'){UI.verFicha=false;render();}
  else if(a==='quitar'){const it=item(k);if(!it)return;if(UI.ficha===k)UI.verFicha=false;await hacer('/api/quitar',it.tipo==='manual'?{manual_id:it.manual_id}:{bien_id:it.bien_id});}
  else if(a==='agendar'||a==='reagendar'){await hacer('/api/agendar',{remate_id:+b.dataset.rid});}
  else if(a==='ignorarq'){await hacer('/api/ignorar_quitado',{bien_id:+b.dataset.bien});}
  else if(a==='reemplazar'){await hacer('/api/reemplazar_manual',{manual_id:+b.dataset.man,remate_id:+b.dataset.rid});}
  else if(a==='nopub'){await hacer('/api/ignorar_publicado',{manual_id:+b.dataset.man});}
  else if(a==='detC'){UI.detC=!UI.detC;renderCentro();}else if(a==='detL'){UI.detL=!UI.detL;renderCentro();}
  else if(a==='vistoC'){UI.detC=false;await hacer('/api/visto',{tipo:'cambios',bienes:EST.cambios.map(c=>c.bien_id)});}
  else if(a==='vistoL'){UI.detL=false;await hacer('/api/visto',{tipo:'llamado',bienes:EST.llamados.map(c=>c.bien_id)});}
  else if(a==='mesAnt'){UI.off=Math.max(0,UI.off-1);renderCentro();}/* nunca antes del mes actual (Diego, 18 de Octubre) */else if(a==='mesSig'){UI.off++;renderCentro();}else if(a==='mesHoy'){UI.off=0;renderCentro();}
  else if(a==='guardarManual'){try{const r=await api('/api/manual',UI.form);UI.form=FORM0();UI.err='';UI.ficha='m'+r.manual_id;UI.sel=UI.ficha;UI.panel=null;UI.verFicha=true;await cargar();irAFicha();}catch(er){UI.err=er.message;renderPanel();}}
});
document.addEventListener('change',async e=>{const t=e.target;
  if(t.dataset.acc==='entregado'){const it=item(t.dataset.k);if(it)await hacer('/api/marcar',{campo:'vv_entregado',valor:t.checked,...(it.tipo==='manual'?{manual_id:it.manual_id}:{bien_id:it.bien_id})});}
  else if(t.dataset.filtro==='edicion'||t.dataset.filtro==='pasados'){UI.f[t.dataset.filtro]=t.type==='checkbox'?t.checked:t.value;await buscar();}
  else if(t.dataset.form==='mod'){UI.form.mod=t.value;}
  else if('ftrib' in t.dataset){UI.ftrib=t.value;renderIzq();}});
let espera=null;
document.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.filtro&&t.dataset.filtro!=='edicion'&&t.dataset.filtro!=='pasados'){UI.f[t.dataset.filtro]=t.value;const x=t.parentNode.querySelector('.borrar');if(x)x.hidden=!t.value;clearTimeout(espera);espera=setTimeout(buscar,250);}
  else if('ufIn' in t.dataset){UI.uf=t.value;document.querySelectorAll('[data-uf-in]').forEach(x=>{if(x!==t)x.value=t.value;});document.querySelectorAll('[data-uf]').forEach(x=>{x.textContent=ufCalc(+x.dataset.uf,x.dataset.uftxt);});}
  else if(t.dataset.form){UI.form[t.dataset.form]=t.value;}});
/* Actualización obligatoria al abrir (decisión de Diego, 20 de Octubre). Tapa la agenda hasta terminar. */
const NUBE={estado:'oculto',r:null};
function dmTxt(f){return ((EST&&EST.ediciones_txt&&EST.ediciones_txt[f])||f).replace(/\.$/,'');}   /* sin el punto final, lo pone la frase */
function renderVelo(){const v=document.getElementById('velo');if(NUBE.estado==='oculto'){v.hidden=true;v.innerHTML='';return;}
  const r=NUBE.r||{};let h='';
  if(NUBE.estado==='trabajando')h=`<div style="font-size:24px;font-weight:800">Actualizando con El Mercurio...</div><div class="peq gris">Se bajan y se cargan las ediciones nuevas que la nube ya leyó. Puede tardar un par de minutos. No cierres la ventana.</div>`;
  else if(NUBE.estado==='error')h=`<div style="font-size:24px;font-weight:800;color:var(--rojo)">No se pudo actualizar</div><div>${E(r.error||'Error desconocido.')}</div><button class="btn" data-acc="nubeReintentar">Reintentar</button><button class="btn2" style="align-self:flex-start" data-acc="nubeSeguir">Abrir la agenda sin actualizar</button><div class="peq gris">Si la abres así, la franja SIN SINCRONIZAR te recordará lo que falta.</div>`;
  else{const c=(r.cargadas||[]).map(dmTxt),t=(r.retomadas||[]).map(dmTxt);
    h=`<div style="font-size:22px;font-weight:800">Actualización terminada con avisos</div>`+
      (c.length?`<div>Se cargaron las ediciones del ${E(c.join(', '))}.</div>`:'')+(t.length?`<div>Se completaron las ediciones del ${E(t.join(', '))}.</div>`:'')+
      (r.bloqueo?`<div style="font-weight:700">${E(r.bloqueo)}</div>`:'')+(r.problemas||[]).map(x=>`<div style="color:var(--rojo);font-weight:700">${E(x)}</div>`).join('')+
      `<button class="btn" data-acc="nubeOk">Entendido</button>`;}
  v.hidden=false;v.innerHTML=`<div class="caja" role="alertdialog" aria-live="assertive">${h}</div>`;}
async function actualizarNube(){if(NUBE.estado==='trabajando')return;NUBE.estado='trabajando';renderVelo();
  try{const r=await fetch('/api/actualizar',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});NUBE.r=await r.json();
    if(NUBE.r.ok===false)NUBE.estado='error';else if((NUBE.r.problemas||[]).length||NUBE.r.bloqueo)NUBE.estado='aviso';else NUBE.estado='oculto';}
  catch(e){NUBE.r={error:'No se pudo hablar con el programa de la agenda. Cierra la ventana minimizada y ábrela de nuevo.'};NUBE.estado='error';}
  await cargar();renderVelo();}
cargar().then(actualizarNube);
setInterval(()=>{if(document.visibilityState==='visible'&&!UI.panel)cargar();},5*60*1000);   // por si se cargó una edición con la página abierta
</script>
